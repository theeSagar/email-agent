# Tool settings only (packages live in requirements.txt).

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: common errors, I: sorted imports, B: likely bugs, UP: modern Python syntax
select = ["E", "F", "I", "B", "UP"]
# FastAPI's `Depends(...)` in default arguments is the normal, intended pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
